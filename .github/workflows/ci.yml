# Проверка при каждом изменении: тесты сервера, синтаксис расширения и сборка APK для Android.
name: Проверка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Тесты сервера и расширения
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты Worker (DNS и бот)
        working-directory: cloudflare
        run: node --test test.mjs
      - name: Синтаксис скриптов
        run: |
          for f in extension/src/background.js extension/src/popup/popup.js; do
            node --input-type=module --check < "$f"
          done
          node --check extension/src/skip.js
          for f in tools/*.mjs scripts/*.mjs; do node --check "$f"; done
      - name: Пропуск рекламы в роликах
        run: node --test extension/test.mjs
      - name: Свои правила разбираются без ошибок
        run: node tools/build.mjs --dns-only --offline

  android:
    name: Сборка APK
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Локальный список для приложения
        run: node tools/build.mjs --dns-only --offline
      - name: Сборка
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chisto-android
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
