<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
:root{--w:1280px;--h:250px}
body{display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:0 72px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
div{text-align:center;border-left:1px solid var(--line);padding:18px 0}
div:first-child{border-left:0}
b{display:block;font-size:110px;line-height:1;font-weight:700}
span{display:block;margin-top:10px;font-size:28px;color:var(--muted)}
</style>
