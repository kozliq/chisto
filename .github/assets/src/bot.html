<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* Telegram (тёмная тема) — шрифт системный, как в самом приложении */
:root{--w:440px;--h:480px}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#0e1621;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#17212b}
header img{width:42px;height:42px;border-radius:50%}
header b{display:block;font-size:16px}
header span{font-size:13px;color:#8ea1b3}
main{flex:1;padding:16px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.me{align-self:flex-end;background:#2b5278;padding:8px 12px;border-radius:14px 14px 4px 14px;font-size:15px}
.bot{align-self:flex-start;max-width:92%}
.msg{background:#182533;padding:10px 12px;border-radius:14px 14px 14px 4px;font-size:15px;line-height:1.38;white-space:pre-line}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.kb a{background:#1f2c3a;border-radius:8px;padding:9px 6px;text-align:center;font-size:14px;color:#f0ebee}
.kb .w{grid-column:span 2}
</style>
<header><img src="../../../brand/kit/avatar-640.png" alt=""><div><b>Чисто — без рекламы</b><span>бот</span></div></header>
<main>
<div class="me">/start</div>
<div class="bot"><div class="msg">Чисто убирает рекламу и трекеры. Бесплатно, без регистрации.

Выберите устройство — откроется страница с одной кнопкой.
Официальные YouTube, TikTok и Instagram не чинятся — честно.</div>
<div class="kb"><a>iPhone и iPad ↗</a><a>Android ↗</a><a>Компьютер ↗</a><a>Роутер ↗</a><a class="w">Прислать расширение файлом</a><a class="w">Поделиться с другом</a></div></div>
</main>
